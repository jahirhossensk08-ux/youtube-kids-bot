name: ToonTales Studio AI Bot

on:
  schedule:
    # रोज़ शाम 5:30 बजे (IST) और सुबह 5:30 बजे (IST) ऑटोमैटिक चलेगा (US ऑडियंस के पीक टाइम के हिसाब से)
    - cron: '0 12 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch: # जब चाहें तब एक बटन दबाकर मैन्युअली चला सकते हैं

# एक समय में दो बोट आपस में न टकराएं, इसके लिए सुरक्षा लॉक
concurrency:
  group: youtube-bot-group
  cancel-in-progress: false

# ताकि बोट पुरानी कहानियों का रिकॉर्ड (used_topics.json) वापस सेव कर सके
permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install System Video & Audio Engines (FFmpeg & Fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: 4. Install All AI, Voice, Video & YouTube Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts gTTS pillow moviepy==1.0.3 imageio-ffmpeg google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: 5. Run ToonTales AI Studio Bot
        env:
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: 6. Save Bot Memory & Logs (No-Repeat History)
        run: |
          git config --local user.email "bot@toontaleshub.com"
          git config --local user.name "ToonTales Studio Bot"
          git add used_topics.json latest_video_plan.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update bot memory and latest script" && git push)
